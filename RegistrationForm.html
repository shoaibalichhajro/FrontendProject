<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form>
        <label for="rollno">Roll no:</label>
        <input id="rollno" name="rollno" type="number" placeholder="Enter roll no" required /> <br><br>

        <label for="name">Name:</label>
        <input id="name" name="name" type="name" placeholder="Enter first name" required />

        <label for="lastname">Last Name:</label>
        <input id="lastname" name="lastname" type="name" placeholder="Enter last name" required /><br><br>

        <label for="fatherName">Father's Name:</label>
        <input type="text" id="fatherName" name="fatherName" placeholder="Enter father's name" required><br><br>

        <label for="DateOfBirth">Date of Birth:</label>
        <input type="number" id="dateOfbirth" name="Date of Birth" placeholder="Date of Birth" required><br><br>

        <label for="fatherName">Father's Name:</label>
        <input type="text" id="fatherName" name="fatherName" placeholder="Enter father's name" required><br><br>

        <label for="mobilenumber">Enter Mobile Number:</label>
        <input type="number" id="mobilenumber" name="mobilenumber" placeholder="Enter mobile number" required><br><br>

        <label for="email">Enter Email Id:</label>
        <input type="email" id="email" name="email" placeholder="Enter email id" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <br><br>

        <label for="department">Department:</label>
        <input type="radio" name="department" value="cs"> CS
        <input type="radio" name="department" value="it"> IT
        <input type="radio" name="department" value="ai"> AI
        <input type="radio" name="department" value="ds"> DS

        <br><br>
        <select> 
            <option>Web Development</option>
            <option>Graphic Designing</option>
            <option>Digital Marketing</option>
        </select>
        <br><br>

        <label for="studentphoto">Upload Student Photo:</label>
        <input type ="file" id="studentphoto" name="studentphoto" accept="image/*" required><br><br>

        <label for="city">City:</label>
        <input type="text" id="city" name="city" placeholder="Enter city" required><br><br>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" placeholder="Enter address" required><br><br>

        <button type="submit">Register</button>

    </form>
</body>
</html>
