<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .profile-card {
            width: 350px;
            background: white;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        .profile-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        h2 {
            margin: 10px 0;
        }

        p {
            color: gray;
            margin: 5px 0;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background-color: blue;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

<div class="profile-card">
    <img src="https://via.placeholder.com/120" alt="Profile Picture">
    <h2>Shoaib Ali</h2>
    <p>Web Developer</p>
    <p>Email: shoaib@example.com</p>
    <p>Location: Karachi, Pakistan</p>
    <button>Edit Profile</button>
</div>

</body>
</html>
